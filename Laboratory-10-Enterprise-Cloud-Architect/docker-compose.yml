# The Enterprise Cloud Architect — ROSQUITA Group
name: rosquita-enterprise-cloud-architect

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-enterprise_cloud}
      MYSQL_USER: ${MYSQL_USER:-rosquita_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - enterprise_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    security_opt:
      - no-new-privileges:true

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-enterprise_cloud}
      WORDPRESS_DB_USER: ${MYSQL_USER:-rosquita_admin}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - enterprise_network
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:
    name: rosquita_enterprise_mysql_data
  wordpress_data:
    name: rosquita_enterprise_wordpress_data

networks:
  enterprise_network:
    name: rosquita_enterprise_network
    driver: bridge
