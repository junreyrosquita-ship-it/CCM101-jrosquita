# CloudNova Technologies - Secure Multi-Tier Web Application
# Stack: WordPress (web tier) + MySQL 8.0 (database tier)
# Usage: copy .env.example to .env, edit the passwords, then run: docker compose up -d

services:
  db:
    image: mysql:8.0
    container_name: cloudnova-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql        # persistent database storage
    networks:
      - backend                       # no published ports: DB is not reachable from outside

  wordpress:
    image: wordpress:latest
    container_name: cloudnova-web
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "80:80"                       # only the web tier is exposed
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - wp_data:/var/www/html         # persistent WordPress files and uploads
    networks:
      - backend

volumes:
  db_data:
  wp_data:

networks:
  backend:
